<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23103050'/%3E%3Cpath fill='%2348c0f0' d='M3 3h2v10H3zM11 3h2v10h-2zM5 4h2v3H5zM9 4h2v3H9zM7 6h2v3H7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/theme.css">
<script src="/tips.js" defer></script>
<style>
  /* The viewer's layout; colors, type and controls are theme.css's. */
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .banner { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--side); border-bottom: 1px solid var(--line); min-width: 0; }
  .back { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: var(--radius); color: var(--text); }
  .back:hover { background: var(--raised); }
  #map-thumb { display: contents; }
  .banner-thumb { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; flex: none; border-radius: 2px; border: 1px solid var(--line); }
  .banner-title { display: grid; min-width: 0; }
  .banner-title h1 { font-size: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .banner-actions .sep { width: 1px; height: 24px; background: var(--line-strong); margin: 0 4px; }
  #save, #publish { padding: 8px 18px; font-size: var(--fs-body); }

  /* In game: this map in the in-game editor, a menu under its button. */
  .in-game { position: relative; }
  #in-game { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: var(--fs-body); }
  #in-game .game-dot { width: 8px; height: 8px; background: var(--off); flex: none; }
  #in-game[data-tone=warn] .game-dot { background: var(--warn); }
  #in-game[data-tone=ok] .game-dot { background: var(--ok); }
  #in-game svg.i { width: 14px; height: 14px; }
  .game-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 360px; z-index: 20; display: grid; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
  .game-menu[hidden] { display: none; }
  .game-head { display: flex; align-items: center; gap: 10px; }
  .game-head h2 { font-size: 18px; margin: 0; }
  .game-head .pill { margin-left: auto; }
  .game-text { margin: 0; }
  .game-join { display: flex; align-items: center; gap: 8px; }
  .game-join .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .game-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .game-buttons .primary { flex: 1; }
  .game-section { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .game-section > button { justify-self: start; }

  .main { display: grid; grid-template-columns: 300px 1fr 280px; min-height: 0; }
  .left, .right { background: var(--surface); overflow-y: auto; min-height: 0; }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .right { border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 18px; }

  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 12px; border-bottom: 1px solid var(--line); flex: none; }
  .tools button { display: grid; place-items: center; padding: 7px 0; background: none; color: var(--muted); border: 1px solid transparent; }
  .tools button:hover:not(:disabled) { background: var(--raised); color: var(--text); }
  .tools button.on, .tools button.on:hover:not(:disabled) { background: var(--selected); color: var(--on-selected); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }

  .stage { position: relative; min-width: 0; min-height: 0; }
  canvas#view, canvas#view:focus-visible { display: block; width: 100%; height: 100%; outline: none; }
  canvas#view.aiming { cursor: crosshair; }
  .cube-wrap { position: absolute; top: 12px; right: 12px; display: flex; align-items: flex-start; gap: 4px; z-index: 2; }
  #cube { width: 104px; height: 104px; display: block; }
  .cube-wrap button { background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); }
  .notice { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(720px, 70%); padding: 10px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow); z-index: 3; }
  .notice.bad { color: var(--bad); }
  .message { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; color: var(--muted); font-size: var(--fs-h3); }
  .message.bad { color: var(--bad); }

  /* Names over the markers: a dark plate with the list's color as a square before the name. */
  .tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* The rectangle a drag in Top view picks with. */
  #marquee { position: absolute; pointer-events: none; border: 1px solid var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); z-index: 2; }
  .speed .modes.three { grid-template-columns: 1fr 1fr; }
  .speed .modes.three button:last-child { grid-column: span 2; }
  .speed .fields { margin-top: 10px; }
  .speed .picked-list { margin: 8px 0 0; }
  .speed .buttons .primary.grow { flex: 1; }
  .speed .field-row { display: grid; gap: 6px; cursor: default; }
  .speed select { width: 100%; }
  .speed .field-row .group-label { margin: 8px 0 0; }
  .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 2px 7px; background: rgba(6, 12, 20, .78); color: #fff; font-size: var(--fs-meta); white-space: nowrap; }
  .tag::before { content: ""; width: 8px; height: 8px; background: var(--tag-color); flex: none; }
  .tag.picked { background: rgba(6, 12, 20, .92); outline: 1px solid #fff; z-index: 1; }
  .tag.size { --tag-color: var(--primary); }
  .tag.size.bad { --tag-color: var(--bad); color: #ffd2cd; }

  /* The left panel: Checklist and Overview tabs, each with its own search. */
  #sidebar { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .side-head { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .side-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius); }
  .side-tabs [role=tab] { display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: 1px solid transparent; color: var(--muted); padding: 5px 8px; }
  .side-tabs [role=tab]:hover { color: var(--text); }
  .side-tabs [role=tab][aria-selected=true] { background: var(--selected); color: var(--on-selected); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
  .tab-count { font-size: var(--fs-meta); font-weight: 400; color: inherit; opacity: .8; }
  .tab-count:empty { display: none; }
  .tab-count.warn { color: var(--warn); opacity: 1; }
  .side-search { display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); cursor: text; }
  .side-search:focus-within { border-color: var(--primary); }
  .side-search svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .side-search input { flex: 1; min-width: 0; border: 0; background: none; padding: 6px 0; outline: none; }
  .sidebar { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 24px; display: flex; flex-direction: column; gap: 20px; }
  .side-empty { color: var(--muted); margin: 0 4px; }
  .sidebar h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
  .checklist ul { list-style: none; margin: 0; padding: 0; }
  .checklist .rows li { display: flex; align-items: center; gap: 8px; padding: 3px 4px; }
  .checklist .rows .dot { width: 8px; height: 8px; background: var(--warn); flex: none; }
  .checklist .done { color: var(--muted); }
  .checklist .done .dot { background: var(--ok); }
  .checklist .problems li, .checklist .warnings li { display: flex; gap: 8px; padding: 6px 8px; margin-top: 6px; border-radius: var(--radius); color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .checklist .warnings li { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .count { color: var(--muted); }
  .checks h3 { font-size: var(--fs-meta); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 4px 6px; }
  .check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .check { display: flex; width: 100%; gap: 8px; align-items: flex-start; text-align: left; background: none; font-size: var(--fs-body); font-weight: 400; padding: 5px 6px; border: 0; color: var(--text); }
  .check:hover:not(:disabled) { background: var(--raised); }
  .check:disabled { cursor: default; }
  .check .dot { width: 8px; height: 8px; background: var(--warn); flex: none; margin-top: 6px; }
  .check .swatch { margin-top: 5px; }
  .swatch.unknown { background: #ff00ff; }
  .overview h3 { font-size: var(--fs-meta); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 4px 6px; }
  .overview h3 ~ h3 { margin-top: 14px; }
  .list { margin-bottom: 6px; }
  .list-head { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px; }
  .list.todo .count { color: var(--warn); }
  .swatch { width: 10px; height: 10px; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
  .entry { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; background: none; font-size: var(--fs-body); font-weight: 400; padding: 4px 6px 4px 22px; border: 0; }
  .entry:hover:not(:disabled) { background: var(--raised); }
  .entry.on, .entry.on:hover:not(:disabled) { background: var(--selected); color: var(--on-selected); }
  .entry-label { white-space: nowrap; }
  .entry-detail { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-meta); }
  .entry.on .entry-detail { color: inherit; }

  /* The right panel: the tool's settings or the picked entry's, else the cuts. */
  .panel h2 { font-size: 18px; margin-bottom: 4px; }
  .panel .sub { color: var(--muted); font-size: var(--fs-meta); margin: 0 0 12px; }
  .panel section + section { border-top: 1px solid var(--line); padding-top: 16px; }
  .choices { display: grid; gap: 2px; }
  .choice { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; font-size: var(--fs-body); font-weight: 400; padding: 6px 8px; border: 1px solid transparent; }
  .choice:hover:not(:disabled) { background: var(--raised); }
  .choice.on, .choice.on:hover:not(:disabled) { background: var(--selected); color: var(--on-selected); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
  .choice .count { margin-left: auto; font-size: var(--fs-meta); }
  .choice.on .count { color: inherit; }
  .field-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .field-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fields label { display: grid; gap: 3px; font-size: var(--fs-meta); color: var(--muted); }
  .fields label b { font-weight: 700; }
  .fields .x b { color: var(--axis-x); } .fields .y b { color: var(--axis-y); } .fields .z b { color: var(--axis-z); }
  .fields input { width: 100%; font-variant-numeric: tabular-nums; padding: 5px 7px; }
  .group-label { font-size: var(--fs-meta); color: var(--muted); margin: 14px 0 6px; }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 12px; }
  .modes button { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .modes.three { grid-template-columns: repeat(3, 1fr); }

  .cut { display: grid; gap: 6px; }
  .cut + .cut { margin-top: 14px; }
  .cut-head { display: flex; align-items: baseline; gap: 8px; }
  .axis-name { font: 600 var(--fs-h3) var(--font-head); }
  .axis-name.x { color: var(--axis-x); } .axis-name.y { color: var(--axis-y); } .axis-name.z { color: var(--axis-z); }
  .cut-head .muted { margin-left: auto; font-size: var(--fs-meta); }
  .cut input[type=range] { width: 100%; margin: 0; }
  .cut[data-axis=x] input { accent-color: var(--axis-x); }
  .cut[data-axis=y] input { accent-color: var(--axis-y); }
  .cut[data-axis=z] input { accent-color: var(--axis-z); }
  .cut-buttons { display: flex; gap: 6px; }
  .cut-buttons button { flex: 1; }

  .status { display: flex; gap: 18px; padding: 6px 16px; background: var(--side); border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-meta); min-height: 32px; white-space: nowrap; overflow: hidden; align-items: center; }
  .status #hover { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .status #picked { color: var(--primary); }
  .status .spacer { flex: 1; }
  .status .warn { color: var(--warn); }

  dialog.settings { width: min(680px, 92vw); padding: 0; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  dialog.settings::backdrop { background: #0008; }
  .settings form { display: grid; gap: 18px; padding: 20px 22px; }
  .settings fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
  .settings legend { font: 600 var(--fs-meta) var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; padding: 0; }
  .settings label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .settings .hint { color: var(--muted); font-size: var(--fs-meta); margin: -4px 0 0 26px; }
  .settings .actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .settings-head { display: flex; align-items: center; gap: 16px; }
  .settings-head h2 { margin: 0; }
  .tabs { display: flex; gap: 2px; margin-left: auto; padding: 2px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius); }
  .tabs [role=tab] { background: none; border: 1px solid transparent; color: var(--muted); padding: 5px 16px; }
  .tabs [role=tab]:hover { color: var(--text); }
  .tabs [role=tab][aria-selected=true] { background: var(--selected); color: var(--on-selected); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
  .settings-panel { display: grid; gap: 18px; max-height: min(64vh, 620px); overflow-y: auto; padding-right: 6px; }
  .settings-panel[hidden] { display: none; }
  /* Keys: a row per action, its label and two keys, and Default when it's changed. */
  .settings .keys .key-rows { display: grid; gap: 4px; }
  .key-row { display: grid; grid-template-columns: 1fr 144px 144px 76px; gap: 6px; align-items: center; }
  .key-label { min-width: 0; }
  .key-slot { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--inset); min-width: 0; }
  .key-slot .key { flex: 1; min-width: 0; padding: 4px 8px; background: none; border: 0; font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--text); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .key-slot.none .key { color: var(--muted); font-family: var(--font); }
  .key-slot .key:hover { background: var(--raised); }
  .key-slot.waiting { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .key-slot.waiting .key { color: var(--primary); font-family: var(--font); }
  .key-clear { display: grid; place-items: center; width: 26px; padding: 0; background: none; border: 0; border-left: 1px solid var(--line); color: var(--muted); }
  .key-clear:hover { color: var(--text); background: var(--raised); }
  .key-clear svg.i { width: 14px; height: 14px; }
  .key-reset { justify-self: end; }
  .keys-note { margin: 0 auto 0 0; color: var(--warn); }
  .keys-actions { display: flex; justify-content: flex-start; }
  /* Map settings (with nothing picked) and the Time tool: each change made when its field is done. */
  .panel input.wide { width: 100%; }
  .panel input.number, .panel input.clock { width: 84px; padding: 5px 7px; }
  .panel input.grow { flex: 1; min-width: 0; padding: 5px 7px; }
  .panel .field-row { flex-wrap: wrap; }
  label.field-row { cursor: pointer; }
  .map-settings .setting { display: grid; gap: 4px; margin-top: 12px; }
  .map-settings .setting .sub, .map-settings .setting .field-row, .map-settings .setting .group-label { margin: 0; }
  .map-settings .buttons.tight { margin-top: 0; }
  .map-settings > .buttons { margin-top: 16px; }
  .panel .queue-note { margin: 8px 0 0; }
</style>
</head>
<body>
<header class="banner">
  <a class="back" href="/#maps" aria-label="Back to Maps" data-tip="Back to Maps"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <span id="map-thumb"></span>
  <div class="banner-title"><h1 id="map-name">Map viewer</h1><span id="map-game" class="muted meta"></span></div>
  <div class="banner-actions">
    <button id="undo" class="icon" aria-label="Undo" data-tip="Undo" data-key="Ctrl+Z"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" class="icon" aria-label="Redo" data-tip="Redo" data-key="Ctrl+Y"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="open-settings" class="icon" aria-label="Settings" data-tip="Settings: the view and the keys"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><rect x="13" y="5" width="4" height="4"/><rect x="7" y="15" width="4" height="4"/></svg></button>
    <span class="sep"></span>
    <div class="in-game">
      <button id="in-game" data-tone="off" aria-haspopup="dialog" aria-expanded="false" aria-controls="game-menu" data-tip="This map in game: Open in game, Preview, the join address"><span class="game-dot" aria-hidden="true"></span>In game<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div id="game-menu" class="game-menu" role="dialog" aria-label="In game" hidden></div>
    </div>
    <button id="save" data-tip="Keep the map as a version in the map store">Save</button>
    <button id="publish" class="primary">Publish</button>
  </div>
</header>
<div class="main">
  <aside class="left" aria-label="Tools, the checklist and the overview">
    <div class="tools" role="toolbar" aria-label="Tools">
      <button data-tool="select" aria-label="Select" data-tip="Select: pick, move and resize" data-key="V"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 7.5-5.5 1.2L10 17z"/><path d="m12.5 11.7 4 6.3"/></svg></button>
      <button data-tool="spawn" aria-label="Spawn" data-tip="Spawn: place spawns" data-key="P"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="6"/><path d="M8 10h8v6H8zM9.5 16v5.5M14.5 16v5.5M8 10l-3 5M16 10l3 5"/></svg></button>
      <button data-tool="marker" aria-label="Marker" data-tip="Marker: place the game's markers" data-key="M"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="8"/><path d="M12 11v10M8 21h8"/></svg></button>
      <button data-tool="region" aria-label="Region" data-tip="Region: draw bounds and regions" data-key="B"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4M12 4h4M20 4v4M20 12v4M20 20h-4M12 20H8M4 20v-4M4 12V8"/></svg></button>
      <button data-tool="height" aria-label="Height" data-tip="Height: set kill Y and the build limit" data-key="H"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16l9-3.5 9 3.5-9 3.5z"/><path d="M12 3v7M9 6l3-3 3 3"/></svg></button>
      <button data-tool="mirror" aria-label="Mirror" data-tip="Mirror: place a plane, pick entries, mirror them across it" data-key="I"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19" stroke-dasharray="2.2 2.4"/><path d="M9 6.5 3 17.5h6z"/><path d="M15 6.5l6 11h-6z"/></svg></button>
      <button data-tool="cut" aria-label="Cut" data-tip="Cut: slice the map by height, X and Z" data-key="C"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-4.5L21 9l-9 4.5z"/><path d="M3 15l9 4.5 9-4.5" stroke-dasharray="2 2.5"/></svg></button>
      <button data-tool="time" aria-label="Time" data-tip="Time: the map's time of day" data-key="T"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></button>
    </div>
    <div id="sidebar"></div>
  </aside>
  <div class="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div id="tags" class="tags"></div>
    <div id="marquee" hidden></div>
    <div class="cube-wrap">
      <button id="view-home" class="icon" aria-label="Home" data-tip="Home: the whole map" data-key="Home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg></button>
      <canvas id="cube" aria-label="View cube: click a side to look from it"></canvas>
    </div>
    <div id="notice" class="notice" hidden></div>
    <div id="message" class="message">Loading the map...</div>
  </div>
  <aside class="right panel" aria-label="Tool settings, map settings and cuts">
    <div id="tool"></div>
    <section id="map-panel" class="map-settings" aria-label="Map settings" hidden></section>
    <section id="cuts" class="cuts">
      <h2>Cuts</h2>
      <p class="sub">Slice the map to see inside.<span id="cuts-keys"></span></p>
      <div class="cut" data-axis="x">
        <div class="cut-head"><span class="axis-name x">X</span><span id="x-label" class="muted"></span></div>
        <input type="range" id="x" step="1" aria-label="X cut">
        <div class="cut-buttons"><button id="x-here" class="small" data-tip="Click a block next: the cut goes to it">Here</button><button id="x-flip" class="small" data-tip="Keep the other side">Flip</button><button id="x-off" class="small">Off</button></div>
      </div>
      <div class="cut" data-axis="y">
        <div class="cut-head"><span class="axis-name y">Y</span><span id="y-label" class="muted"></span></div>
        <input type="range" id="y" step="1" aria-label="Y cut: the top layer kept">
        <div class="cut-buttons"><button id="y-here" class="small" data-tip="Click a block next: the cut goes to its layer">Here</button><button id="y-off" class="small" data-tip="Show every layer">Off</button></div>
      </div>
      <div class="cut" data-axis="z">
        <div class="cut-head"><span class="axis-name z">Z</span><span id="z-label" class="muted"></span></div>
        <input type="range" id="z" step="1" aria-label="Z cut">
        <div class="cut-buttons"><button id="z-here" class="small" data-tip="Click a block next: the cut goes to it">Here</button><button id="z-flip" class="small" data-tip="Keep the other side">Flip</button><button id="z-off" class="small">Off</button></div>
      </div>
    </section>
  </aside>
</div>
<footer class="status">
  <span id="picked"></span><span id="hover"></span><span class="spacer"></span><span id="note" class="warn"></span><span id="info"></span>
</footer>
<dialog id="settings" class="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <div class="settings-head">
      <h2 id="settings-title">Settings</h2>
      <div class="tabs" role="tablist" aria-label="Settings">
        <button type="button" role="tab" id="tab-view" aria-selected="true" aria-controls="panel-view">View</button>
        <button type="button" role="tab" id="tab-keys" aria-selected="false" aria-controls="panel-keys">Keys</button>
      </div>
    </div>
    <div id="panel-view" class="settings-panel" role="tabpanel" aria-labelledby="tab-view">
    <fieldset>
      <legend>Blocks</legend>
      <label><input type="checkbox" id="toggle-occlusion"> Corner darkening</label>
      <label><input type="checkbox" id="toggle-variation"> Brightness variation</label>
      <label><input type="checkbox" id="toggle-darken"> Darken below the Y cut</label>
      <label><input type="checkbox" id="toggle-hidden"> Hidden blocks: outline barriers, invisible bedrock and light blocks</label>
    </fieldset>
    <fieldset>
      <legend>Look</legend>
      <label><input type="radio" name="look" id="look-colors"> Average colors: each face one color</label>
      <label><input type="radio" name="look" id="look-textures"> Vanilla textures</label>
    </fieldset>
    <fieldset>
      <legend>Past the cut</legend>
      <label><input type="radio" name="past" id="past-faded"> Faded: drawn see-through</label>
      <label><input type="radio" name="past" id="past-gone"> Gone: not drawn</label>
    </fieldset>
    <fieldset>
      <legend>Markers</legend>
      <label><input type="checkbox" id="toggle-names"> Names over the markers</label>
    </fieldset>
    <fieldset id="movement">
      <legend>Moving around</legend>
      <label><input type="checkbox" id="toggle-wasd"> WASD flying</label>
      <p id="fly-keys" class="hint"></p>
      <label>Flying speed <select id="fly-speed"><option value="slow">Slow</option><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
    </fieldset>
    </div>
    <div id="panel-keys" class="settings-panel keys" role="tabpanel" aria-labelledby="tab-keys" hidden></div>
    <div class="actions"><p id="keys-note" class="keys-note" aria-live="polite" hidden></p><button value="done" class="primary">Done</button></div>
  </form>
</dialog>
<script type="module" src="/viewer/app.js"></script>
</body>
</html>
