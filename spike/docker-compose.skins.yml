# Skin capture spikes (see spike/skins/README.md): a relay in front of the running lobby on its own
# ports (skins), and a bot that joins the lobby (watcher). Run from network/ with the npm scripts:
# spike:skins:check, spike:skins, spike:watcher:check, spike:watcher, and spike:skins:down for both.
name: minecade-skin-spike

services:
  skins:
    build: ./skins
    container_name: minecade-skin-spike
    environment:
      LOBBY_URL: http://minecade-lobby:19132
      ADVERTISE: ${LAN_HOST:?set LAN_HOST in .env}
      BDS_VERSION: ${BDS_VERSION:?set BDS_VERSION in .env}
    ports:
      - "19140:19140/tcp"
      - "19141-19150:19141-19150/udp"
    volumes:
      - cache:/cache
      - ./skins/out:/spike/out
    stop_grace_period: 5s

  # The watcher: a bot that joins the lobby as the spare account and saves skins from the player
  # list (watcher.ts). It only connects out, so it publishes no ports.
  watcher:
    build: ./skins
    container_name: minecade-skin-watcher
    command: ["node", "watcher.ts"]
    environment:
      LOBBY_URL: http://minecade-lobby:19132
      BDS_VERSION: ${BDS_VERSION:?set BDS_VERSION in .env}
      WATCH_MINUTES: ${SKIN_WATCH_MINUTES:-10}
    volumes:
      - cache:/cache
      - ./skins/out:/spike/out
    stop_grace_period: 5s

# The main stack's network, so the spikes reach the lobby by its container name.
networks:
  default:
    name: minecade
    external: true

volumes:
  cache:
    name: minecade-skin-spike-cache
