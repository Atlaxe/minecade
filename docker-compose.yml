# Minecade network: the lobby and the orchestrator. The orchestrator creates and removes game
# server containers (minecade-game-<session>) itself. Start and stop with the Minecade Panel, or:
#   docker compose --env-file .env up -d --build
#   docker compose --env-file .env down
name: minecade

x-server-env: &server-env
  TRANSPORT: ${TRANSPORT:-http}
  PUBLIC_HOST: ${PUBLIC_HOST:-auto}
  LAN_HOST: ${LAN_HOST:?set LAN_HOST in .env}
  LAN_PLAYERS: ${LAN_PLAYERS:-}
  ALLOW_LIST: ${ALLOW_LIST:-}
  DEV_MIN_PLAYERS: ${DEV_MIN_PLAYERS:-}

services:
  lobby:
    image: minecade/bds:local
    build:
      context: .
      dockerfile: docker/bds/Dockerfile
      target: server
      args:
        EULA: ${EULA:-}
        BDS_VERSION: ${BDS_VERSION:-1.26.60.6}
    container_name: minecade-lobby
    environment:
      <<: *server-env
      GAME: lobby
      MAP: ${LOBBY_MAP:-spaceship}
      SERVER_ID: lobby
      IDENTITY: lobby
      SERVER_PORT: "19132"
      SERVER_NAME: Minecade lobby
      DEV_DEMO_GAMES: ${DEV_DEMO_GAMES:-}
      DEV_HOLO_PREVIEW: ${DEV_HOLO_PREVIEW:-}
      WATCHER_GAMERTAG: ${WATCHER_GAMERTAG:-}
      ORCH_URL: http://orchestrator:8080
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
    volumes:
      - keys:/keys
    stdin_open: true
    labels:
      minecade.role: lobby
    stop_grace_period: 10s

  orchestrator:
    image: minecade/orchestrator:local
    build:
      context: .
      dockerfile: docker/bds/Dockerfile
      target: orchestrator
    container_name: minecade-orchestrator
    environment:
      <<: *server-env
      SERVER_IMAGE: minecade/bds:local
      NETWORK: minecade
      COMPOSE_PROJECT: minecade
      KEYS_VOLUME: minecade-keys
      ORCH_URL: http://orchestrator:8080
      DATA_DIR: /data
      DEV_DEMO_STATS: ${DEV_DEMO_STATS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    ports:
      # The debug API stays on this PC; servers reach the orchestrator over the network.
      - "127.0.0.1:8080:8080"
    labels:
      minecade.role: orchestrator
    init: true
    # Time to send players home and remove a running game container on shutdown.
    stop_grace_period: 30s

  # The skin watcher (watcher/watcher.ts): a bot that stays in the lobby as the spare account set in
  # WATCHER_GAMERTAG and saves players' skins to ./skins, which the build renders into the lobby
  # pack. Off (it exits) while WATCHER_GAMERTAG is empty; the first start asks for a sign-in in its
  # log (docker logs minecade-watcher).
  watcher:
    image: minecade/watcher:local
    build: ./watcher
    container_name: minecade-watcher
    depends_on:
      - lobby
    environment:
      LOBBY_URL: http://lobby:19132
      BDS_VERSION: ${BDS_VERSION:-1.26.60.6}
      WATCHER_GAMERTAG: ${WATCHER_GAMERTAG:-}
    volumes:
      - watcher-auth:/auth
      - ./skins:/skins
    labels:
      minecade.role: watcher
    restart: on-failure
    stop_grace_period: 5s

networks:
  default:
    name: minecade

volumes:
  # Saved server identity keys, so players accept server trust once per server, not on every
  # start. `docker compose down` keeps it; deleting it means everyone accepts trust again.
  keys:
    name: minecade-keys
  # Player stats (stats.db, the raw stats-events.jsonl, and daily backups/). Kept by
  # `docker compose down` and the panel's Stop; only `down -v` or deleting it erases stats.
  data:
    name: minecade-data
  # The skin watcher's sign-in (the spare Microsoft account). Deleting it means signing in again.
  watcher-auth:
    name: minecade-watcher-auth
